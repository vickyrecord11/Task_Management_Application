        <div class="left">

            <div class="top-section">

                <div class="logo-section">

                    <img src="clipboard-check-line-svgrepo-com.svg" class="icon1">

                    <h1>Task Manager</h1>

                </div>

            </div>

            <div class="middle-section">

                <h2 id="tasks-btn" class="menu-item active-menu">
                    <img src="tasks.svg" class="icon2">

                    <span>Tasks</span>
                </h2>


                <h2 id="categories-btn" class="menu-item">
                    <img src="category.svg" class="icon2">
                    <span>Categories</span>
                </h2>


                <h2 id="priority-btn" class="menu-item">
                    <img src="priority.svg" class="icon2">
                    <span>Priority</span>
                </h2>

            </div>


            <div class="summary-section">

                <h2>Summary</h2>

                <div class="status">

                    <div class="dot total"></div>

                    <p class="text">Total Tasks</p>

                    <span>10</span>

                </div>


                <div class="status">

                    <div class="dot todo"></div>

                    <p class="text">To Do</p>

                    <span>4</span>

                </div>


                <div class="status">

                    <div class="dot progress"></div>

                    <p class="text">In Progress</p>

                    <span>3</span>

                </div>


                <div class="status">

                    <div class="dot completed"></div>

                    <p class="text">Completed</p>

                    <span>3</span>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right">

            <div class="right-top">

                    <h2>Tasks</h2>

                <div class="top-actions">

                    <div class="search-box">

                        <img src="search-svgrepo-com.svg" class="search-icon">

                        <input type="text" placeholder="Search tasks...">

                    </div>

                    <button class="add-task-btn">

                        <img src="plus-large-svgrepo-com.svg" class="btn-icon">

                        <span>Add Task</span>

                    </button>

                </div>

            </div>
