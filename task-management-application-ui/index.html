<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="left">

            <div class="top-section">

                <div class="logo-section">

                    <img src="clipboard-check-line-svgrepo-com.svg" class="icon1">

                    <h1>Task Manager</h1>

                </div>

            </div>

            <div class="summary-section">

                <h4>Summary By Status</h4>


                <div class="status">

                    <div class="dot todo"></div>

                    <p class="text">To Do</p>

                    <span id="todoTasks">0</span>

                </div>


                <div class="status">

                    <div class="dot progress"></div>

                    <p class="text">In Progress</p>

                    <span id="progressTasks">0</span>

                </div>


                <div class="status">

                    <div class="dot completed"></div>

                    <p class="text">Completed</p>

                    <span id="completedTasks">0</span>

                </div>

            </div>

            <div class="summary-section priority-summary">

                <h4>Summary By Priority</h4>

                <div class="status">

                    <div class="dot high"></div>

                    <p class="text">High</p>

                    <span id="highTasks">0</span>

                </div>

                <div class="status">

                    <div class="dot medium"></div>

                    <p class="text">Medium</p>

                    <span id="mediumTasks">0</span>

                </div>

                <div class="status">

                    <div class="dot low"></div>

                    <p class="text">Low</p>

                    <span id="lowTasks">0</span>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right">

            <div class="right-top">

                <div class="heading-section">

                    <h2>Tasks</h2>

                    <p>
                        Manage and organize your tasks efficiently
                    </p>

                </div>

                <div class="top-actions">

                    <button class="add-task-btn" id="openModal">

                        <img src="plus-large-svgrepo-com.svg" class="btn-icon">

                        <span>Add Task</span>

                    </button>

                </div>

            </div>

            <div class="filter-row">

                <div class="search-box">

                    <img src="search-svgrepo-com.svg" class="search-icon">

                    <input type="text" id="searchInput" placeholder="Search tasks...">

                </div>

                <div class="filter-dropdown">

                    <button type="button" id="categoryBtn" class="filter-btn">
                        Category
                    </button>

                    <div id="categoryMenu" class="dropdown-menu">

                        <label>
                            <input type="checkbox" value="Backend">
                            Backend
                        </label>

                        <label>
                            <input type="checkbox" value="Frontend">
                            Frontend
                        </label>

                        <label>
                            <input type="checkbox" value="Database">
                            Database
                        </label>

                        <label>
                            <input type="checkbox" value="Testing">
                            Testing
                        </label>

                        <label>
                            <input type="checkbox" value="DevOps">
                            DevOps
                        </label>

                        <label>
                            <input type="checkbox" value="Other">
                            Other
                        </label>

                    </div>

                </div>

                <div class="filter-dropdown">

                    <button id="statusBtn" class="filter-btn">
                        Status
                    </button>

                    <div id="statusMenu" class="dropdown-menu">

                        <label>
                            <input type="checkbox" value="TO_DO">
                            To Do
                        </label>

                        <label>
                            <input type="checkbox" value="IN_PROGRESS">
                            In Progress
                        </label>

                        <label>
                            <input type="checkbox" value="DONE">
                            Done
                        </label>

                    </div>

                </div>

                <div class="filter-dropdown">

                    <button id="priorityBtn" class="filter-btn">
                        Priority
                    </button>

                    <div id="priorityMenu" class="dropdown-menu">

                        <label>
                            <input type="checkbox" value="HIGH">
                            High
                        </label>

                        <label>
                            <input type="checkbox" value="MEDIUM">
                            Medium
                        </label>

                        <label>
                            <input type="checkbox" value="LOW">
                            Low
                        </label>

                    </div>

                </div>


                <select id="sortSelect">

                    <option value="">Sort By</option>

                    <option value="nameAsc">Task Name (A-Z)</option>
                    <option value="nameDesc">Task Name (Z-A)</option>

                    <option value="categoryAsc">Category (A-Z)</option>
                    <option value="categoryDesc">Category (Z-A)</option>

                    <option value="dateAsc">Due Date (Earliest)</option>
                    <option value="dateDesc">Deu Date (Latest)</option>

                    <option value="statusAsc">Status (A-Z)</option>
                    <option value="statusDesc">Status (Z-A)</option>

                    <option value="priorityHighLow">Priority (High-Low)</option>
                    <option value="priorityLowHigh">Priority (Low-High)</option>

                </select>

                <button id="resetFiltersBtn">
                    Reset
                </button>

            </div>




            <div class="table-section">

                <div class="table-scroll">

                    <table>

                        <thead>

                            <tr>

                                <th>S.No</th>

                                <th>Task Name</th>

                                <th>Category</th>

                                <th>Description</th>

                                <th>Due Date</th>

                                <th>Status</th>

                                <th>Priority</th>

                </div>

                <div class="table-footer">

                    <p id="taskCount">Showing 1 to 5 of 5 tasks</p>

                    <div class="pagination">

                        <button id="prevBtn" class="page-btn">
                            &#8249;
                        </button>

                        <button id="pageNumber" class="page-btn active">
                            1
                        </button>

                        <button id="nextBtn" class="page-btn">
                            &#8250;
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="modal-overlay" id="taskModal">

        <div class="modal">

            <div class="modal-header">
                <h3>Add / Update Task</h3>

                <button class="close-btn">&times;</button>
            </div>

            <div class="modal-body">

                <div class="form-group">

                    <label>Task Name <span>*</span></label>
                    <input type="text" id="taskName" placeholder="Enter task name">

                </div>

                <div class="form-group">

                    <label>Category <span>*</span></label>
                    <input type="text" id="category">
                </div>

                <div class="form-group">

                    <label>Description</label>
                    <textarea id="description" placeholder="Enter description"></textarea>
                </div>

                <div class="form-group">

                    <label>Due Date <span>*</span></label>
                    <input type="date" id="dueDate">
                </div>

                <div class="form-group">

                    <label>Status <span>*</span></label>

                    <select id="status">
                        <option value="">Select status</option>
                        <option value="TO_DO">To Do</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="DONE">Done</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Priority <span>*</span></label>
                    <select id="priority">
                        <option value="">Select priority</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">

                <button class="cancel-btn">Cancel</button>
                <button class="save-btn">Save Task</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
